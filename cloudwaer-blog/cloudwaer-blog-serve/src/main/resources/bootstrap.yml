spring:
  application:
    name: cloudwaer-blog-serve
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: ""
      config:
        server-addr: localhost:8848
        namespace: ""
        file-extension: yml
        shared-configs:
          - data-id: application-common.yml
            group: DEFAULT_GROUP
            refresh: true
          # 加载服务特定配置文件
          - data-id: application-cloudwaer-blog-serve-dev.yml
            group: DEFAULT_GROUP
            refresh: true

server:
  port: 4343
spring:
  application:
    name: cloudwaer-flowable-serve
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: ""
      config:
        server-addr: localhost:8848
        namespace: ""
        file-extension: yml
        shared-configs:
          - data-id: application-common.yml
            group: DEFAULT_GROUP
            refresh: true
          - data-id: application-cloudwaer-flowable-serve-dev.yml
            group: DEFAULT_GROUP
            refresh: true

management:
  metrics:
    export:
      simple:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

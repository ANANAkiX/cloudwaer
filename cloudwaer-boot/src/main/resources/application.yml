server:
  port: 9999

spring:
  application:
    name: cloudwaer-boot
  main:
    web-application-type: servlet
    allow-bean-definition-overriding: true

  # 文章导入等文件上传
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  # 多数据源：各模块沿用微服务时期的原库（集成模块各一库：admin/flowable/codegen/blog）
  # primary=flowable：保证 Flowable 引擎（无 ThreadLocal 时）绝不落到 admin 库
  # admin/codegen/blog 由 cloudwaer-common-datasource 按路径/包约定自动路由
  datasource:
    dynamic:
      primary: flowable
      strict: false
      datasource:
        admin:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://localhost:3306/cloudwaer?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
          username: root
          password: root
        flowable:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://localhost:3306/cloudwaer_flowable?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
          username: root
          password: root
        codegen:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://localhost:3306/cloudwaer_codegen_config?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
          username: root
          password: root
        blog:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://localhost:3306/cloudwaer_blog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
          username: root
          password: root
        wiki:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://localhost:3306/cloudwaer_wiki?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
          username: root
          password: root

  data:
    redis:
      host: localhost
      port: 6379

  autoconfigure:
    exclude:
      - com.alibaba.cloud.nacos.NacosConfigAutoConfiguration
      - com.alibaba.cloud.nacos.NacosDiscoveryAutoConfiguration
      - com.alibaba.cloud.nacos.discovery.NacosDiscoveryClientAutoConfiguration
      - com.alibaba.cloud.nacos.discovery.NacosServiceRegistryAutoConfiguration

  cloud:
    bootstrap:
      enabled: false
    discovery:
      enabled: false
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
    openfeign:
      client:
        config:
          cloudwaer-admin-serve:
            url: http://localhost:${server.port}

# Feign: 单体模式下固定走本机（由前端只改 .env 来调整 base url）
# (deprecated) left intentionally blank; use spring.cloud.openfeign.client.config

management:
  metrics:
    export:
      simple:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,mappings

logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: DEBUG

cloudwaer:
  #是否开启验证码（与 cloudwaer-ui/.env 的 VITE_LOGIN_CAPTCHA 保持一致，两边必须同步改）
  captcha:
    enabled: false
  api-scanner:
    serviceId: cloudwaer-boot
  # 本地文件兜底目录（sys_oss_config.provider=LOCAL 时）
  file:
    local-dir: ./uploads
  # 阿里云 OSS 兜底（后台「文件管理·OSS 配置」优先；此处为 yml 默认）
  # 正式环境建议改 Nacos 共享配置，勿把密钥提交 git
  oss:
    aliyun:
      endpoint: oss-cn-hangzhou.aliyuncs.com
      access-key-id: ""
      access-key-secret: ""
      bucket: ""
  # 第三方登录（GitHub 等）回跳白名单：逗号分隔 origin（如 https://blog.example.com）
  # localhost / 127.0.0.1 始终放行，无需配置；生产环境把各前端正式域名加进来
  oauth:
    redirect-origins: ""
  # 出站 HTTP 代理（GitHub OAuth 换票等外网请求）：yml 兜底，后台「服务器设置」可覆盖并发布热生效
  # non-proxy-hosts 默认含 localhost，避免内部 Feign 被带进外部代理；微服务部署补上网内网段/服务名
  proxy:
    enabled: false
    host: ""
    port: 0
    non-proxy-hosts: "localhost|127.0.0.1|::1"


mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.cloudwaer.**.entity
  configuration:
    map-underscore-to-camel-case: true

flowable:
  database-schema-update: update
  async-executor-activate: false
  idm:
    enabled: false
